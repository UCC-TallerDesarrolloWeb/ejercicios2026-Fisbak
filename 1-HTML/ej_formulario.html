<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ejercicio Formulario</title>
    <style>
      form {
        display: block;
        margin-top: 0em;
      }
    </style>
  </head>
  <body>
    <!--Cree un Formulario con los campos que se proponen a continuacion-->
    <!--Agregue el atributo legend-->

    <!--Si tienes dudas de como hacer un formulario, puedes consultar:
    https://www.w3schools.com/html/tryit.asp?filename=tryhtml_elem_output-->

    <h3>
      Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!
    </h3>
    <form name="form-suscripcion">
      <fildset>
        <legend>Datos Personales</legend>
      <p>
        Nombre:
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ingrese su Nombre" />
      </p>
      <p>
        Apellido:
        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" name="apellido" placeholder="Ingrese su Apellido" />
      </p>
      <p>
        Sexo: 
        <label for="masculino">Masculino</label>
        <input type="radio" id="masculino" name="genero" value="Masculino" />
        <label for="femenino">Femenino</label>
        <input type="radio" id="femenino" name="genero" value="Femenino" />
      </p>
      <p>
        <label for="edad">Edad: </label>
        <input type="number" id="edad" name="edad" placeholder="Edad" /></p>
        <!--forma alternativa-->
        <!--<label>Edad: <input type ... > </label>-->
      </fildset>
      <fildset>
        <legend>Datos de la Cuenta</legend>
      <p>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="usuario@dominio.com" />
      </p>
      <p>
        <label for="usuario">Usuario:</label>
        <input type="text" id="usuario" name="usuario" placeholder="Nombre de usuario" />
      </p>
      <p>
        <label for="password">Password:</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Ingrese su contraseña"
        />
      </p>
      <p>
        <label for="segunda-password">Confirmar Password:</label>
        <input
          type="password"
          id="segunda-password"
          name="confirm-password"
          placeholder="Ingrese nuevamente su contraseña"
        />
      </p>
      </fildset>
      <fildset>
        <legend>Tipo de suscripcion</legend>
      <p>
        <label for="tipo-servicio">Tipo de servicio:</label>
        <select id="tipo-servicio" name="tipo-servicio">
          <option value="Free">Free</option>
          <option value="Standard">Standard</option>
          <option value="Premium">Premium</option>
        </select>
      </p>

      <p>
        Tema: <label for="politica">Política</label> <input type="checkbox" id="politica" value="Política" /> 
        <label for="negocios">Negocios</label>
        <input type="checkbox" id="negocios" value="Negocios" /> 
        <label for="tecnologia">Tecnología</label>
        <input type="checkbox" id="tecnologia" value="Tecnología" /> 
        <label for="salud">Salud</label>
        <input type="checkbox" id="salud" value="Salud" />
      </p>
      </fildset>
      <p>
        <label for="agregar-un-comentario">Agregue un comentario:</label>
        <textarea id="agregar-un-comentario">
            Deje su comentario...
        </textarea>
      </p>
      <p>
        <button type="button">Boton de Enviar</button>
      </p>
    </form>
  </body>
</html>
