<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Productos</title>
        <link href="catalogo.css" type="text/css" rel="stylesheet">
        <script type="text/javascript" src="tienda.js"></script>
    </head>

    <body class="grid-container" onload="mostrarCatalogo()">
        <header class="item1">
            Catalogo de Productos
        </header>
        <nav class="item2">
            <a href="productos.html">Catalogo de Productos</a>
            <a href>Carrito de Compras</a>
        </nav>
        <aside class="item3">
            <fieldset>
                <legend>Buscador</legend>
                <label for="search">Buscar</label>
                <input type="text" name="search" id="search" placeholder="Buscar...">
            </fieldset>
            <fieldset>
                <legend>Precios</legend>
                <p>
                    <label for="price-min">Minimo</label>
                    <input type="number" name="price=min" id="price-min" min="0">
                </p>
                <p>
                    <label for="price-max">Maximo</label>
                    <input type="number" name="price=max" id="price-max" min="0">
                </p>
            </fieldset>
            <fieldset>
                <legend>Tipo de Productos</legend>
                <p>
                    <input type="checkbox" name="tipo" id="protectores" value="protectores">
                    <label for="protectores">Protectores</label>
                    <input type="checkbox" name="tipo" id="entrenamiento" value="entrenamiento">
                    <label for="entrenamiento">Entrenamiento</label>
                    <input type="checkbox" name="tipo" id="dobok" value="dobok">
                    <label for="dobok">Dobok</label>
                </p>
            </fieldset>
        </aside>
        <dialog id="modal">
            <h2 id="nombre-producto">Cabezal Cerrado</h2>
            <p id="descripcion-producto">Cabezal de sparring disponible en color azul y rojo.</p>
            <button type="button" onclick="cerrarModal()">Cerrar</button>
        </dialog>
        <main id="catalogo" class="item4">

        </main>

        <footer class="item5">
            Contacto
        </footer>
    </body>
</html>
